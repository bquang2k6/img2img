<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Img to Img</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a1a; padding: 2rem; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p { color: #888; font-size: .875rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: .875rem; margin-bottom: .25rem; color: #aaa; }
  input, textarea { width: 100%; padding: .75rem; border: 1px solid #333; border-radius: 8px; background: #0f0f0f; color: #eee; font-size: .875rem; margin-bottom: 1rem; }
  textarea { resize: vertical; min-height: 80px; }
  button { width: 100%; padding: .75rem; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .preview { margin-top: 1rem; }
  .compare { display: flex; gap: 1rem; }
  .compare figure { flex: 1; margin: 0; text-align: center; }
  .compare figcaption { font-size: .75rem; color: #888; margin-bottom: .5rem; }
  .compare img { width: 100%; border-radius: 8px; }
  .error { color: #f87171; font-size: .875rem; margin-top: .5rem; }
  .loading { margin-top: 1rem; text-align: center; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>Img to Img</h1>
  <p>Flux Kontext Pro — image-to-image generation</p>
  <form id="form">
    <label for="image_url">Image URL</label>
    <input type="url" id="image_url" value="https://firebasestorage.googleapis.com/v0/b/locket-img/o/users%2FslE0Szp0QjbbqSEnLI7RiSmDGBe2%2Fmoments%2Fthumbnails%2FuTMY2t8txIMe9Wlo5g8o.webp?alt=media&token=34f6fe44-9c28-49dc-a89b-9c77d7396d5f" required>
    <div id="input-preview" class="preview"></div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" required>Keep the person's identity unchanged. Change the path in the image to black.</textarea>
    <button type="submit" id="btn">Generate</button>
  </form>
  <div id="loading" class="loading" style="display:none">Processing...</div>
  <div id="result" class="preview"></div>
  <div id="error" class="error"></div>
</div>
<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const error = document.getElementById('error');

  const imageUrlInput = document.getElementById('image_url');
  const inputPreview = document.getElementById('input-preview');

  imageUrlInput.addEventListener('input', () => {
    const url = imageUrlInput.value.trim();
    inputPreview.innerHTML = url ? `<img src="${url}" style="width:100%;border-radius:8px" alt="Input preview">` : '';
  });
  imageUrlInput.dispatchEvent(new Event('input'));

  form.onsubmit = async (e) => {
    e.preventDefault();
    error.textContent = '';
    result.innerHTML = '';
    btn.disabled = true;
    loading.style.display = 'block';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image_url: imageUrlInput.value,
          prompt: document.getElementById('prompt').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      const urls = data.output;
      const outSrc = Array.isArray(urls) ? urls[0] : urls;
      const inSrc = imageUrlInput.value;
      result.innerHTML = `
        <div class="compare">
          <figure>
            <figcaption>Input</figcaption>
            <img src="${inSrc}" alt="Input">
          </figure>
          <figure>
            <figcaption>Output</figcaption>
            <img src="${outSrc}" alt="Output">
          </figure>
        </div>`;
    } catch (err) {
      error.textContent = err.message;
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  };
</script>
</body>
</html>
