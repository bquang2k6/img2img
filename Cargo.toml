[package]
name = "img-to-img-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "charset", "http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socketioxide = "0.18.9"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

